<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="border-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="transparent" />
      <rect x="0" y="0" width="20" height="1" fill="#9b7d39" />
      <rect x="0" y="1" width="20" height="1" fill="#d4af37" opacity="0.7" />
      <rect x="0" y="18" width="20" height="1" fill="#9b7d39" />
      <rect x="0" y="19" width="20" height="1" fill="#d4af37" opacity="0.7" />
      <rect x="0" y="0" width="1" height="20" fill="#9b7d39" />
      <rect x="1" y="0" width="1" height="20" fill="#d4af37" opacity="0.7" />
      <rect x="18" y="0" width="1" height="20" fill="#9b7d39" />
